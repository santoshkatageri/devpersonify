name: Verify deployed release
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: HTTPS site origin to verify (no trailing path)
        required: true
        default: https://devpersonify.learnwithsk.dev
        type: string
      expected_commit:
        description: Full 40-character SHA deployed by Cloudflare (use the merge commit after merging)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version, direct routes, and asset contents
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node scripts/verify-release.mjs "$DEPLOYMENT_URL" "$EXPECTED_COMMIT"
